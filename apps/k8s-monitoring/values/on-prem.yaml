cluster:
  name: on-prem

destinations:
  - name: prometheus
    type: prometheus
    url: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write

alloy-metrics:
  enabled: true
  alloy:
    configMap:
      content: |
        // Self-reporting telemetry (required by k8s-monitoring)
        prometheus.exporter.unix "kubernetes_monitoring_telemetry" {
          set_collectors = ["textfile"]
          textfile {
            directory = "/etc/alloy"
          }
        }

        discovery.relabel "kubernetes_monitoring_telemetry" {
          targets = prometheus.exporter.unix.kubernetes_monitoring_telemetry.targets
          rule {
            target_label = "instance"
            action = "replace"
            replacement = "k8s-monitoring"
          }
          rule {
            target_label = "job"
            action = "replace"
            replacement = "integrations/kubernetes/kubernetes_monitoring_telemetry"
          }
        }

        prometheus.scrape "kubernetes_monitoring_telemetry" {
          job_name   = "integrations/kubernetes/kubernetes_monitoring_telemetry"
          targets    = discovery.relabel.kubernetes_monitoring_telemetry.output
          scrape_interval = "60s"
          clustering {
            enabled = true
          }
          forward_to = [prometheus.relabel.kubernetes_monitoring_telemetry.receiver]
        }

        prometheus.relabel "kubernetes_monitoring_telemetry" {
          rule {
            source_labels = ["__name__"]
            regex = "grafana_kubernetes_monitoring_.*"
            action = "keep"
          }
          forward_to = [prometheus.remote_write.prometheus.receiver]
        }

        // Loki Metrics Scraping
        discovery.kubernetes "loki_pods" {
          role = "pod"
          namespaces {
            names = ["grafana-loki"]
          }
        }
        
        discovery.relabel "loki_metrics" {
          targets = discovery.kubernetes.loki_pods.targets
          
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex = "loki"
            action = "keep"
          }
          
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
          
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }
          
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
            target_label = "component"
          }
          
          rule {
            source_labels = ["__address__"]
            regex = "([^:]+)(?::\\d+)?"
            replacement = "$1:3100"
            target_label = "__address__"
          }
          
          rule {
            target_label = "__metrics_path__"
            replacement = "/metrics"
          }
        }
        
        prometheus.scrape "loki_metrics" {
          targets = discovery.relabel.loki_metrics.output
          forward_to = [prometheus.remote_write.prometheus.receiver]
          scrape_interval = "60s"
          clustering {
            enabled = true
          }
        }
        
        // Mimir Metrics Scraping
        discovery.kubernetes "mimir_pods" {
          role = "pod"
          namespaces {
            names = ["grafana-mimir"]
          }
        }
        
        discovery.relabel "mimir_metrics" {
          targets = discovery.kubernetes.mimir_pods.targets
          
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            regex = "mimir"
            action = "keep"
          }
          
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
          
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }
          
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
            target_label = "component"
          }
          
          rule {
            source_labels = ["__address__"]
            regex = "([^:]+)(?::\\d+)?"
            replacement = "$1:8080"
            target_label = "__address__"
          }
          
          rule {
            target_label = "__metrics_path__"
            replacement = "/metrics"
          }
        }
        
        prometheus.scrape "mimir_metrics" {
          targets = discovery.relabel.mimir_metrics.output
          forward_to = [prometheus.remote_write.prometheus.receiver]
          scrape_interval = "60s"
          clustering {
            enabled = true
          }
        }

        // Destination: prometheus
        otelcol.exporter.prometheus "prometheus" {
          add_metric_suffixes = true
          resource_to_telemetry_conversion = false
          forward_to = [prometheus.remote_write.prometheus.receiver]
        }

        prometheus.remote_write "prometheus" {
          endpoint {
            url = "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090/api/v1/write"
            headers = {}
            tls_config {
              insecure_skip_verify = false
            }
            send_native_histograms = false

            queue_config {
              capacity = 10000
              min_shards = 1
              max_shards = 50
              max_samples_per_send = 2000
              batch_send_deadline = "5s"
              min_backoff = "30ms"
              max_backoff = "5s"
              retry_on_http_429 = true
              sample_age_limit = "0s"
            }

            write_relabel_config {
              source_labels = ["cluster"]
              regex = ""
              replacement = "on-prem"
              target_label = "cluster"
            }
            write_relabel_config {
              source_labels = ["k8s_cluster_name"]
              regex = ""
              replacement = "on-prem"
              target_label = "k8s_cluster_name"
            }
          }

          wal {
            truncate_frequency = "2h"
            min_keepalive_time = "5m"
            max_keepalive_time = "8h"
          }
        }

# Disable everything else
alloy-logs:
  enabled: false
alloy-singleton:
  enabled: false
alloy-receiver:
  enabled: false
alloy-profiles:
  enabled: false
clusterMetrics:
  enabled: false
clusterEvents:
  enabled: false
podLogs:
  enabled: false
nodeLogs:
  enabled: false