cluster:
  id: 1
  name: on-premise
  serviceCIDR: 10.43.0.0/16

k8sServicePort: 6443

clustermesh:
  apiserver:
    enabled: true

k8sClientExponentialBackoff:
  enabled: true

gatewayAPI:
  enabled: true
  gatewayController:
    enabled: true

kubeProxyReplacement: "true"

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
    - 10.10.0.0/16
    clusterPoolIPv4MaskSize: 24

l7Proxy: true

proxy:
  prometheusPort: 9964
  excludeInterfaces:
  - cilium_host
  - cilium_net
  - lxc+
  - docker+
  excludeCIDRs:
  - 10.43.0.0/16
  - 127.0.0.0/8

enableIPv4Masquerade: true

policyEnforcementMode: "default"

l2announcements:
  enabled: true

# ADD THIS - Critical for control plane taints
tolerations:
- operator: Exists

hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: helm
  relay:
    enabled: true
    replicas: 2
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
    tolerations:
    - operator: Exists
  ui:
    enabled: true
    replicas: 2
    service:
      type: ClusterIP
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
    tolerations:
    - operator: Exists

nodePort:
  enabled: true
  
operator:
  replicas: 3
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  # ADD THIS - For operator to run on control planes if needed
  tolerations:
  - operator: Exists

rolloutCiliumPods: true
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 2

prometheus:
  enabled: true
  port: 9962
  serviceMonitor:
    enabled: false