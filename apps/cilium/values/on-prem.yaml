cluster:
  id: 1
  name: on-premise
clustermesh:
  apiserver:
    enabled: true
# Cilium configuration for routing mode <native>
# routingMode: native
# ipv4NativeRoutingCIDR: 172.30.0.0/24  # Replace with your node subnet
# enableIPv4Masquerade: true
# enable-ip-masq-agent: false
# Cilium configuration for routing mode <native>
gatewayAPI:
  enabled: true
kubeProxyReplacement: "true"
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
    - 10.10.0.0/16
l7Proxy: true
l2announcements:
  enabled: true
hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: helm # Switch to 'certmanager' if using cert-manager
  relay:
    enabled: true
    replicas: 1
    tolerations:
    - operator: Exists
  ui:
    enabled: true
    replicas: 1
    service:
      type: ClusterIP
    tolerations:
    - operator: Exists
nodePort:
  enabled: true
operator:
  replicas: 1