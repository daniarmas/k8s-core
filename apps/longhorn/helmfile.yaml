repositories:
  - name: longhorn
    url: https://charts.longhorn.io

releases:
  - name: longhorn
    namespace: longhorn-system
    createNamespace: true
    chart: longhorn/longhorn
    version: 1.9.0
    wait: false
    timeout: 600
    values:
      - values/{{ .Values.environment | default .Environment.Name }}.yaml