repositories:
- name: oauth2-proxy
  url: https://oauth2-proxy.github.io/manifests

releases:
- name: oauth2-proxy
  namespace: oauth2-proxy
  createNamespace: true
  chart: oauth2-proxy/oauth2-proxy
  values:
    - values/{{ .Values.environment | default .Environment.Name }}.yaml
    - extraEnv:
        - name: OAUTH2_PROXY_COOKIE_DOMAINS
          value: ".home.daniel-enrique.com"
        - name: OAUTH2_PROXY_COOKIE_SECURE
          value: "true"
        - name: OAUTH2_PROXY_WHITELIST_DOMAINS
          value: ".home.daniel-enrique.com"
        - name: OAUTH2_PROXY_REDIRECT_URL
          value: "https://oauth.home.daniel-enrique.com/oauth2/callback"
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy
              key: cookie-secret
    - extraArgs:
        cookie-domain: ".home.daniel-enrique.com"
        whitelist-domain: ".home.daniel-enrique.com"
        cookie-secure: "true"
        cookie-samesite: "lax"
