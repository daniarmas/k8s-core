apiVersion: batch/v1
kind: Job
metadata:
  name: minio-users-to-vault
  namespace: minio-tenant
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio-vault-manager
      containers:
      - name: mc-vault
        image: alpine:3.19
        env:
        - name: MINIO_ENDPOINT
          value: "https://minio.minio-tenant.svc.cluster.local:443"
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: storage-configuration
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: storage-configuration
              key: MINIO_ROOT_PASSWORD
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        volumeMounts:
        - name: ca-bundle
          mountPath: /usr/local/share/ca-certificates/internal-ca.crt
          subPath: ca.crt
          readOnly: true
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          echo "Installing dependencies..."
          echo "http://dl-cdn.alpinelinux.org/alpine/v3.19/main" > /etc/apk/repositories
          echo "http://dl-cdn.alpinelinux.org/alpine/v3.19/community" >> /etc/apk/repositories
          
          apk add --no-cache ca-certificates
          update-ca-certificates
          
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.19/main" > /etc/apk/repositories
          echo "https://dl-cdn.alpinelinux.org/alpine/v3.19/community" >> /etc/apk/repositories
          
          apk add --no-cache curl openssl unzip
          
          export SSL_CERT_FILE=/usr/local/share/ca-certificates/internal-ca.crt
          
          echo "Installing MinIO mc client..."
          curl -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          
          echo "Installing Vault CLI..."
          curl -L https://releases.hashicorp.com/vault/1.15.4/vault_1.15.4_linux_amd64.zip -o vault.zip
          unzip vault.zip
          chmod +x vault
          mv vault /usr/local/bin/
          rm vault.zip
          
          echo "Authenticating to Vault..."
          KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
            role=minio-admin jwt=$KUBE_TOKEN)
          
          echo "Configuring MinIO client..."
          mc alias set myminio $MINIO_ENDPOINT $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
          
          echo "Checking if readwrite policy exists..."
          if mc admin policy info myminio readwrite >/dev/null 2>&1; then
            echo "✓ Policy 'readwrite' already exists, skipping creation"
          else
            echo "Creating readwrite policy..."
            cat > /tmp/readwrite.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["s3:*"],
                "Resource": ["arn:aws:s3:::*"]
              }
            ]
          }
          EOF
            mc admin policy create myminio readwrite /tmp/readwrite.json
            echo "✓ Policy 'readwrite' created"
          fi
          
          echo ""
          echo "Creating MinIO users and storing in Vault..."
          
          # Harbor
          echo "Creating Harbor user..."
          HARBOR_ACCESS="harbor-access-key"
          HARBOR_SECRET=$(openssl rand -base64 32)
          mc admin user add myminio "$HARBOR_ACCESS" "$HARBOR_SECRET"
          mc admin policy attach myminio readwrite --user "$HARBOR_ACCESS"
          vault kv put secret/s3/minio/access-keys/harbor \
            REGISTRY_STORAGE_S3_ACCESSKEY="$HARBOR_ACCESS" \
            REGISTRY_STORAGE_S3_SECRETKEY="$HARBOR_SECRET" \
            endpoint="$MINIO_ENDPOINT"
          echo "✓ Harbor user created"
          
          # Grafana Mimir
          echo "Creating Grafana Mimir user..."
          MIMIR_ACCESS="grafana-mimir-access-key"
          MIMIR_SECRET=$(openssl rand -base64 32)
          mc admin user add myminio "$MIMIR_ACCESS" "$MIMIR_SECRET"
          mc admin policy attach myminio readwrite --user "$MIMIR_ACCESS"
          vault kv put secret/s3/minio/access-keys/grafana-mimir \
            access_key="$MIMIR_ACCESS" \
            secret_key="$MIMIR_SECRET" \
            endpoint="$MINIO_ENDPOINT"
          echo "✓ Grafana Mimir user created"
          
          # Grafana Loki
          echo "Creating Grafana Loki user..."
          LOKI_ACCESS="grafana-loki-access-key"
          LOKI_SECRET=$(openssl rand -base64 32)
          mc admin user add myminio "$LOKI_ACCESS" "$LOKI_SECRET"
          mc admin policy attach myminio readwrite --user "$LOKI_ACCESS"
          vault kv put secret/s3/minio/access-keys/grafana-loki \
            access_key="$LOKI_ACCESS" \
            secret_key="$LOKI_SECRET" \
            endpoint="$MINIO_ENDPOINT"
          echo "✓ Grafana Loki user created"
          
          # CockroachDB
          echo "Creating CockroachDB user..."
          CRDB_ACCESS="cockroachdb-access-key"
          CRDB_SECRET=$(openssl rand -base64 32)
          mc admin user add myminio "$CRDB_ACCESS" "$CRDB_SECRET"
          mc admin policy attach myminio readwrite --user "$CRDB_ACCESS"
          vault kv put secret/s3/minio/access-keys/cockroachdb \
            access_key="$CRDB_ACCESS" \
            secret_key="$CRDB_SECRET" \
            endpoint="$MINIO_ENDPOINT"
          echo "✓ CockroachDB user created"
          
          echo ""
          echo "=========================================="
          echo "All MinIO users created successfully!"
          echo "Credentials stored in Vault at:"
          echo "  - secret/s3/minio/access-keys/harbor"
          echo "  - secret/s3/minio/access-keys/grafana-mimir"
          echo "  - secret/s3/minio/access-keys/grafana-loki"
          echo "  - secret/s3/minio/access-keys/cockroachdb"
          echo "=========================================="
      volumes:
      - name: ca-bundle
        secret:
          secretName: internal-ca-bundle-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-vault-manager
  namespace: minio-tenant