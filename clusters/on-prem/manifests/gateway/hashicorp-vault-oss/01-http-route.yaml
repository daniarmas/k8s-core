apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-route
  namespace: vault
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: default  # ← ADD THIS! Gateway is in default namespace
    sectionName: https
  hostnames:
  - "vault.home.daniel-enrique.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: vault
      port: 8200