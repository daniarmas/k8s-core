apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgadmin4-secret
  namespace: harbor
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: default
  
  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: harbor/pgadmin4
  
  # Kubernetes secret to create/update
  destination:
    name: pgadmin4
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m
  
  # Rollout restart deployments when secret changes
  rolloutRestartTargets:
    - kind: Deployment
      name: pgadmin4