apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client-root-tls
  namespace: cockroachdb
spec:
  secretName: client-root-tls
  issuerRef:
    name: vault-cockroachdb
    kind: ClusterIssuer
  commonName: root
  duration: 8760h
  renewBefore: 720h
  usages:
  - digital signature
  - key encipherment
  - client auth