---
# Service Account for the Job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cockroachdb-user-setup
  namespace: cockroachdb
  labels:
    app: cockroachdb
    component: user-setup

---
# Role for managing ConfigMaps (optional - only if SAVE_CONNECTION_STRINGS=true)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cockroachdb-user-setup-role
  namespace: cockroachdb
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "update", "patch", "get"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cockroachdb-user-setup-binding
  namespace: cockroachdb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cockroachdb-user-setup-role
subjects:
- kind: ServiceAccount
  name: cockroachdb-user-setup
  namespace: cockroachdb
