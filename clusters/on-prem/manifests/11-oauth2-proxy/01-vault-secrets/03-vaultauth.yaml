apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-proxy-secret
  namespace: oauth2-proxy
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: oauth2-proxy
spec:
  # Address of your Vault server
  address: "http://vault.vault.svc.cluster.local:8200"
  # Skip TLS verification (set to true if using HTTP or self-signed certs)
  skipTLSVerify: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: oauth2-proxy
spec:
  # Reference to the VaultConnection in the same namespace
  vaultConnectionRef: default

  # Kubernetes authentication method
  method: kubernetes
  mount: kubernetes

  kubernetes:
    # Role configured in Vault for oauth2-proxy
    role: "oauth2-proxy"

    # Service account oauth2-proxy uses
    serviceAccount: "oauth2-proxy-secret"
