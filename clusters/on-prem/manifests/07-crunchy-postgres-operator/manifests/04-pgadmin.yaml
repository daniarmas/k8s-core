apiVersion: v1
kind: ServiceAccount
metadata:
  name: crunchy-postgres-pgadmin
  namespace: harbor
  labels:
    app: pgadmin4
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgadmin-secret
  namespace: harbor
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: default
  
  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: harbor/crunchy-postgres/pgadmin
  
  # Kubernetes secret to create/update
  destination:
    name: pgadmin-secret
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m
  
  # Rollout restart deployments when secret changes
  rolloutRestartTargets:
    - kind: StatefulSet
      name: pgadmin4
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgadmin4
  namespace: harbor
  labels:
    app: pgadmin4
spec:
  serviceName: pgadmin4-headless
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin4
  template:
    metadata:
      labels:
        app: pgadmin4
    spec:
      serviceAccountName: crunchy-postgres-pgadmin
      containers:
      - name: pgadmin4
        image: dpage/pgadmin4:8.12
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          valueFrom:
            secretKeyRef:
              name: pgadmin-secret
              key: email
        - name: PGADMIN_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pgadmin-secret
              key: password
        - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
          value: "False"
        - name: PGADMIN_CONFIG_LOGIN_BANNER
          value: "PostgreSQL Administration - On-Premise Cluster"
        volumeMounts:
        - name: pgadmin-data
          mountPath: /var/lib/pgadmin
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
  volumeClaimTemplates:
  - metadata:
      name: pgadmin-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin4-headless
  namespace: harbor
  labels:
    app: pgadmin4
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: pgadmin4
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin4-service
  namespace: harbor
  labels:
    app: pgadmin4
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: pgadmin4
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin-route
  namespace: harbor
spec:
  parentRefs:
  - name: cilium-gateway
    namespace: default  # ← ADD THIS! Gateway is in default namespace
    sectionName: https
  hostnames:
  - "pgadmin.home.daniel-enrique.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pgadmin4-service
      port: 80
