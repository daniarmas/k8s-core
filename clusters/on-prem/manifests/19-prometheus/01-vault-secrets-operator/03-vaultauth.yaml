apiVersion: v1
kind: Namespace
metadata:
  name: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-vault-sa
  namespace: prometheus
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: prometheus
    meta.helm.sh/release-namespace: prometheus
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: prometheus
spec:
  # Address of your Vault server
  address: "http://vault.vault.svc.cluster.local:8200"
  # Skip TLS verification (set to true if using HTTP or self-signed certs)
  skipTLSVerify: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana
  namespace: prometheus
spec:
  # Reference to the VaultConnection in the same namespace
  vaultConnectionRef: default

  # Kubernetes authentication method
  method: kubernetes
  mount: kubernetes

  kubernetes:
    # Role configured in Vault for prometheus
    role: "prometheus"

    # Service account prometheus uses
    serviceAccount: "prometheus-vault-sa"
