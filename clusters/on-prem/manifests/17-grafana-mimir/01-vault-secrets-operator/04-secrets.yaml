apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mimir-secret
  namespace: grafana-mimir
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: mimir
  
  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: mimir
  
  # Kubernetes secret to create/update
  destination:
    name: mimir
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m
  
  # Rollout restart deployments when secret changes
    # rolloutRestartTargets:
    #   - kind: Deployment
    #     name: mimir