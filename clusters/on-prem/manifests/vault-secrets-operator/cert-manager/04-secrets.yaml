apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: digitalocean-dns01-token
  namespace: cert-manager
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: default
  
  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: cert-manager/digitalocean
  
  # Kubernetes secret to create/update
  destination:
    name: digitalocean-dns01-token
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m
  
  # Rollout restart deployments when secret changes
  rolloutRestartTargets:
    - kind: Deployment
      name: cert-manager