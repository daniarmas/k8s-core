apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-vault-sa
  namespace: harbor
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: harbor
    meta.helm.sh/release-namespace: harbor
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: harbor
  namespace: harbor
spec:
  # Address of your Vault server
  address: "http://vault.vault.svc.cluster.local:8200"
  # Skip TLS verification (set to true if using HTTP or self-signed certs)
  skipTLSVerify: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: harbor-app
  namespace: harbor
spec:
  # Reference to the VaultConnection in the same namespace
  vaultConnectionRef: harbor

  # Kubernetes authentication method
  method: kubernetes
  mount: kubernetes

  kubernetes:
    # Role configured in Vault for harbor
    role: "harbor-app"

    # Service account harbor uses
    serviceAccount: "harbor-vault-sa"
