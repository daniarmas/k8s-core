apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-internal-tls
  namespace: harbor
spec:
  secretName: harbor-internal-tls
  issuerRef:
    name: vault-harbor
    kind: ClusterIssuer
  commonName: harbor-core.harbor.svc.cluster.local
  dnsNames:
  # Full FQDNs - MUST match what's in Vault role!
  - harbor-core.harbor.svc.cluster.local
  - harbor-registry.harbor.svc.cluster.local
  - harbor-portal.harbor.svc.cluster.local
  - harbor-jobservice.harbor.svc.cluster.local
  - harbor-trivy.harbor.svc.cluster.local
  
  # Bare hostnames (for in-namespace communication)
  - harbor-core
  - harbor-registry
  - harbor-portal
  - harbor-jobservice
  - harbor-trivy
  duration: 8760h
  renewBefore: 720h
  usages:
  - digital signature
  - key encipherment
  - server auth
  - client auth