apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-dns01
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: daniel.armas9706@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    # - http01:
    #     gatewayHTTPRoute:
    #       parentRefs:
    #       - name: cilium-gateway
    #         namespace: default
    - dns01:
        digitalocean:
          tokenSecretRef:
            name: digitalocean-dns01-token
            key: access-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: daniel.armas9706@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    # - http01:
    #     gatewayHTTPRoute:
    #       parentRefs:
    #       - name: cilium-gateway
    #         namespace: default
    - dns01:
        digitalocean:
          tokenSecretRef:
            name: digitalocean-dns01-token
            key: access-token