apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: prometheus-google-oauth
  namespace: prometheus
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: grafana

  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: prometheus/grafana-google-oauth

  # Kubernetes secret to create/update
  destination:
    name: grafana-google-oauth
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-credentials
  namespace: prometheus
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: grafana

  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: prometheus/grafana-credentials

  # Kubernetes secret to create/update
  destination:
    name: grafana-credentials
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m