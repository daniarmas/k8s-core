apiVersion: v1
kind: Namespace
metadata:
  name: grafana-mimir
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimir-sa
  namespace: grafana-mimir
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: default
  namespace: grafana-mimir
spec:
  # Address of your Vault server
  address: "http://vault.vault.svc.cluster.local:8200"
  # Skip TLS verification (set to true if using HTTP or self-signed certs)
  skipTLSVerify: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: mimir
  namespace: grafana-mimir
spec:
  # Reference to the VaultConnection in the same namespace
  vaultConnectionRef: default

  # Kubernetes authentication method
  method: kubernetes
  mount: kubernetes

  kubernetes:
    # Role configured in Vault for mimir
    role: "mimir"

    # Service account mimir uses
    serviceAccount: "mimir-sa"
