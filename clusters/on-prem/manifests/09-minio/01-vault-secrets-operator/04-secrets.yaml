apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-console-credentials
  namespace: minio-tenant
spec:
  # Reference to VaultConnection (uses default if not specified)
  vaultAuthRef: minio

  # Path to secret in Vault
  mount: secret
  type: kv-v2
  path: minio/minio-console-credentials

  # Kubernetes secret to create/update
  destination:
    name: minio-console-credentials
    create: true
    type: Opaque
  
  # Refresh the secret every 5 minutes
  refreshAfter: 5m
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: storage-configuration
  namespace: minio-tenant
spec:
  vaultAuthRef: minio
  mount: secret
  type: kv-v2
  path: minio/storage-configuration

  destination:
    name: storage-configuration
    create: true
    type: Opaque
    transformation:
      templates:
        config.env:
          text: |
            export MINIO_ROOT_USER="{{ .Secrets.MINIO_ROOT_USER }}"
            export MINIO_ROOT_PASSWORD="{{ .Secrets.MINIO_ROOT_PASSWORD }}"
            export MINIO_STORAGE_CLASS_STANDARD="{{ .Secrets.MINIO_STORAGE_CLASS_STANDARD }}"
            export MINIO_BROWSER="{{ .Secrets.MINIO_BROWSER }}"
  
  refreshAfter: 5m